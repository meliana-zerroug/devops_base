#ec2-3-128-204-204.us-east-2.compute.amazonaws.com : ok=5    changed=4    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0
# Voici l'adresse sur laquelle notre application était accessible " http://3.128.204.204:8080/"


- name: Add Node packages to yum
  shell: curl -fsSL https://rpm.nodesource.com/setup_16.x | bash -

- name: Install Node.js
  yum:
    name: nodejs
    state: present

- name: Copy sample app
  copy:
    src: app.js
    dest: /home/ec2-user/app.js
    owner: ec2-user
    group: ec2-user
    mode: 0755

- name: Start sample app
  shell: nohup node /home/ec2-user/app.js > /home/ec2-user/app.log 2>&1 &
  args:
    chdir: /home/ec2-user/
    creates: /tmp/node-app.pid