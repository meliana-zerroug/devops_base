- name: Add Node packages to yum 
  shell: curl -fsSL https://rpm.nodesource.com/setup_21.x | bash -

- name: Install Node.js
  yum:
    name: nodejs

- name: Create app user          
  user:
    name: app-user

- name: Install pm2              
  npm:
    name: pm2
    version: latest
    global: true

- name: Configure PM2 to run at startup
  shell: |
    env PATH=$PATH:/usr/bin pm2 startup systemd -u app-user --hp /home/app-user
    systemctl enable pm2-app-user
